<title>Peptide Calc</title>
<style>
:root{--bg:#0f0f14;--card:#1a1a24;--tx:#fff;--t2:#b9b9c8;--t3:#555566}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px)}
#app{max-width:640px;margin:0 auto}
h2{font-size:18px;margin:22px 0 10px}
.hero{border-radius:20px;padding:18px;color:#fff}
.hero .n{font-size:24px;font-weight:800}.box{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 15px;border-radius:999px;border:2px solid;background:transparent;color:var(--tx);font-weight:600;font-size:15px;min-height:44px;font-family:inherit}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:700;font-size:15px;background:transparent;color:var(--t2);font-family:inherit}
.seg button.on{background:linear-gradient(120deg,#FF3D7F,#651FFF);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:12px}
label{flex:1 1 130px;font-size:13px;color:var(--t2);display:flex;flex-direction:column;gap:4px}
input{font-size:18px;padding:12px;border-radius:12px;border:2px solid #333;background:var(--card);color:#fff;width:100%;font-family:inherit}
.tile{border-radius:16px;padding:13px 15px;color:#fff;flex:1 1 140px;min-width:0}
.tile .b{font-size:22px;font-weight:800}.tile .s{font-size:13px;opacity:.9}
.calc{width:100%;margin-top:22px;padding:18px;border:0;border-radius:18px;background:linear-gradient(120deg,#FF3D7F,#FF7A00);color:#fff;font-size:22px;font-weight:800;font-family:inherit;box-shadow:0 6px 18px rgba(255,61,127,.35)}
.instr{margin-top:14px;background:linear-gradient(120deg,#FF3D7F,#AA00FF);border-radius:16px;padding:14px 16px;font-weight:600}
.warn{background:#FF1744;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:600}
.note{background:#FFB300;color:#222;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #2a2a36}
a{color:#7fd8ff}.small{font-size:12px;color:var(--t2)}
.vc{border:2px solid;border-radius:16px;padding:12px;margin-bottom:10px}
.chip{max-width:100%;white-space:normal;text-align:left;line-height:1.25}
.disc{background:#241833;border:1px solid #651FFF;border-radius:14px;padding:10px 14px;margin:12px 0 0;font-weight:700}
.hero,.disc,.note,.instr,.box,.warn{overflow-wrap:break-word}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
</style></head><body><div id="app"></div>

":"GHK-Cu","mg":50,"unit":"mg","c":"#00ACC1","def":1,"hint":"1\u20132 mg daily (commonly cited)"},{"id":"tb","name":"TB-500","mg":10,"unit":"mg","c":"#00BFA5","def":2,"hint":"2\u20132.5 mg twice weekly (commonly cited loading)"},{"id":"bpc","name":"BPC-157","mg":10,"unit":"mcg","c":"#00C853","def":250,"hint":"250\u2013500 mcg 1\u20132x daily (commonly cited)"}],"manualComps":false},{"id":"tb","name":"TB-500","type":"peptide","vials":[10],"manual":false,"unit":"mg","def":2,"hint":"2\u20132.5 mg twice weekly (commonly cited loading)","fda":"Not FDA-approved; limited 503A compounding discretion (2026)","c":"#00BFA5","about":"TB-500 is a thymosin beta-4-related peptide studied for wound and muscle repair through G-actin binding and cell migration. This listing is separate from the short 17-23 fragment, which is its own product.","comps":null,"manualComps":false},{"id":"bpc","name":"BPC-157","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":250,"hint":"250\u2013500 mcg 1\u20132x daily (commonly cited)","fda":"Not FDA-approved; limited 503A compounding discretion (2026)","c":"#00C853","about":"BPC-157 is a synthetic fragment of a gastric protein, studied mainly in animal models of tendon, gut, and soft-tissue repair. Proposed mechanisms include nitric oxide signaling and growth-factor pathways involved in angiogenesis and healing.","comps":null,"manualComps":false},{"id":"serm","name":"Sermorelin","type":"peptide","vials":[5,15],"manual":false,"unit":"mcg","def":250,"hint":"200\u2013300 mcg nightly (commonly cited, off-label)","fda":"Was FDA-approved (Geref), discontinued 2008","c":"#651FFF","about":"Sermorelin is a growth-hormone-releasing hormone (1-29) analog that stimulates pituitary growth-hormone release through the GHRH receptor. It was previously sold as Geref and later discontinued.","comps":null,"manualComps":false},{"id":"nad","name":"NAD+","type":"peptide","vials":[100,500],"manual":false,"unit":"mg","def":50,"hint":"50\u2013100 mg 1\u20133x weekly SC (no live source confirmed)","fda":"Not FDA-approved as a drug","c":"#D500F9","about":"NAD+ is a coenzyme, not a peptide, used in redox reactions and as a substrate for sirtuins and PARPs. Research on raising NAD looks at cellular energy metabolism and DNA-repair pathways.","comps":null,"manualComps":false},{"id":"melanotan-1","name":"Melanotan 1","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#6A1B9A","about":"Melanotan I (afamelanotide) is an alpha-MSH analog and melanocortin-1 receptor agonist studied for increasing melanin. An implant form is approved for erythropoietic protoporphyria; research vials are a separate, unapproved product.","comps":null,"manualComps":false},{"id":"ghk","name":"GHK-Cu","type":"peptide","vials":[125],"manual":false,"unit":"mg","def":1,"hint":"1\u20132 mg daily (commonly cited)","fda":"Not FDA-approved; FDA Category 2","c":"#00ACC1","about":"GHK-Cu is the copper complex of the tripeptide glycyl-L-histidyl-L-lysine, studied in skin and wound models. It is researched as a signal that can shift gene expression toward collagen and tissue remodeling.","comps":null,"manualComps":false},{"id":"cjc-1295-no-dac-5mg-ipamorelin-10mg-15mg-blend","name":"CJC-1295 No DAC 5mg / Ipamorelin 10mg (15mg Blend)","type":"blend","vials":[15],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#00B0FF","about":"This vial is labeled 5 mg of CJC-1295 without DAC and 10 mg of ipamorelin. CJC-1295 without DAC is a short-acting GHRH analog, and ipamorelin is a ghrelin-receptor agonist; both are studied for growth-hormone pulses.","comps":[{"id":"cjc","name":"CJC-1295 No DAC","mg":5,"unit":"mcg","c":"#00B0FF","def":100,"hint":"100 mcg 1\u20133x daily (commonly cited)"},{"id":"ipa","name":"Ipamorelin","mg":10,"unit":"mcg","c":"#2962FF","def":200,"hint":"100\u2013300 mcg 1\u20133x daily (commonly cited)"}],"manualComps":false},{"id":"bpc20","name":"BPC-157 20mg","type":"peptide","vials":[20],"manual":false,"unit":"mcg","def":250,"hint":"250\u2013500 mcg 1\u20132x daily (commonly cited)","fda":"Not FDA-approved; limited 503A compounding discretion (2026)","c":"#00C853","about":"BPC-157 is a synthetic fragment of a gastric protein, studied mainly in animal models of tendon, gut, and soft-tissue repair. Proposed mechanisms include nitric oxide signaling and growth-factor pathways involved in angiogenesis and healing.","comps":null,"manualComps":false},{"id":"ipa","name":"Ipamorelin","type":"peptide","vials":[5,10],"manual":false,"unit":"mcg","def":200,"hint":"100\u2013300 mcg 1\u20133x daily (commonly cited)","fda":"Not FDA-approved; FDA Category 2","c":"#2962FF","about":"Ipamorelin is a selective ghrelin-receptor agonist studied for stimulating growth-hormone pulses. Compared with older GHRPs, published work describes less effect on cortisol, prolactin, and appetite.","comps":null,"manualComps":false},{"id":"tesamorelin-ipamorelin-18mg-blend","name":"Tesamorelin / Ipamorelin 18mg (Blend)","type":"blend","vials":[18],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#AA00FF","about":"This blend combines tesamorelin, a GHRH analog, with ipamorelin, a ghrelin-receptor agonist, both studied for growth-hormone release. The 18 mg label does not say how many milligrams of each peptide are in the vial.","comps":[{"id":"tesa","name":"Tesamorelin","mg":null,"unit":"mg","c":"#AA00FF","def":1.4,"hint":"Egrifta SV 1.4 mg daily (2 mg + 0.5 mL); WR 1.28 mg daily (11.6 mg + 1.3 mL)"},{"id":"ipa","name":"Ipamorelin","mg":null,"unit":"mcg","c":"#2962FF","def":200,"hint":"100\u2013300 mcg 1\u20133x daily (commonly cited)"}],"manualComps":true},{"id":"cagri-sema-5mg-5mg-blend","name":"Cagri + Sema 5mg/5mg Blend","type":"blend","vials":[10],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#4A148C","about":"This vial is labeled 5 mg Cagri and 5 mg Sema. In the published literature those short names mean cagrilintide, a long-acting amylin analog, and semaglutide, a GLP-1 receptor agonist, which have been studied together for satiety and glucose control.","comps":[{"id":"cagri","name":"Cagri","mg":5,"unit":"mg","c":"#4A148C","def":null,"hint":null},{"id":"sema","name":"Sema","mg":5,"unit":"mg","c":"#E53935","def":null,"hint":null}],"manualComps":false},{"id":"melanotan-2","name":"Melanotan 2","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#4527A0","about":"Melanotan II is a cyclic alpha-MSH analog that activates several melanocortin receptors, including MC1R and MC4R. It is studied for pigmentation and, because it is less receptor-selective, for appetite and sexual-arousal effects.","comps":null,"manualComps":false},{"id":"cjc-1295-no-dac-ipamorelin-5mg-5mg","name":"CJC-1295 No DAC / Ipamorelin (5MG / 5MG)","type":"blend","vials":[10],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#00B0FF","about":"This vial is labeled 5 mg of CJC-1295 without DAC and 5 mg of ipamorelin. Both are studied for growth-hormone release: CJC-1295 without DAC through the GHRH receptor, and ipamorelin through the ghrelin receptor.","comps":[{"id":"cjc","name":"CJC-1295 No DAC","mg":5,"unit":"mcg","c":"#00B0FF","def":100,"hint":"100 mcg 1\u20133x daily (commonly cited)"},{"id":"ipa","name":"Ipamorelin","mg":5,"unit":"mcg","c":"#2962FF","def":200,"hint":"100\u2013300 mcg 1\u20133x daily (commonly cited)"}],"manualComps":false},{"id":"pt","name":"PT-141","type":"peptide","vials":[10],"manual":false,"unit":"mg","def":1.75,"hint":"1.75 mg SC as needed; max 1 per 24 h, 8 per month","fda":"FDA-approved (Vyleesi autoinjector); vials are research","c":"#F50057","about":"PT-141 (bremelanotide) is a melanocortin-receptor agonist, notably at MC4R, studied for central effects on sexual desire rather than for blood-vessel dilation. The autoinjector is an approved drug for hypoactive sexual desire disorder in premenopausal women; loose vials are a research product.","comps":null,"manualComps":false},{"id":"epi","name":"Epithalon","type":"peptide","vials":[10,50],"manual":false,"unit":"mg","def":5,"hint":"5\u201310 mg daily for 10\u201320 days (commonly cited)","fda":"Not FDA-approved","c":"#3D5AFE","about":"Epithalon (also spelled epitalon) is a synthetic tetrapeptide related to pineal extracts, studied for melatonin regulation and for telomerase in cell experiments. Evidence in humans is limited.","comps":null,"manualComps":false},{"id":"thymosin-alpha-1","name":"Thymosin Alpha 1","type":"peptide","vials":[10],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#558B2F","about":"Thymosin alpha-1 (thymalfasin) is a 28-amino-acid thymic peptide studied as an immune modulator. Research focuses on T-cell maturation and Toll-like receptor signaling, and the peptide is licensed in some countries.","comps":null,"manualComps":false},{"id":"aod","name":"AOD-9604","type":"peptide","vials":[5],"manual":false,"unit":"mcg","def":300,"hint":"250\u2013300 mcg daily (commonly cited)","fda":"Not FDA-approved; FDA Category 2","c":"#FFD600","about":"AOD-9604 is a modified fragment from the C-terminal region of human growth hormone, studied for fat metabolism. It was designed to keep a lipolytic region of growth hormone without the growth-promoting domain.","comps":null,"manualComps":false},{"id":"kpv","name":"KPV","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#6D4C41","about":"KPV is the C-terminal tripeptide of alpha-MSH (lysine-proline-valine), studied for anti-inflammatory effects in gut and skin models. That work centers on melanocortin-related signaling.","comps":null,"manualComps":false},{"id":"dsip-delta-sleep-inducing-peptide","name":"DSIP (Delta Sleep-Inducing Peptide)","type":"peptide","vials":[5],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#283593","about":"DSIP (delta sleep-inducing peptide) is studied for effects on sleep architecture. Its mechanism is unsettled; work so far has looked at modulation of sleep-related neurotransmitter systems.","comps":null,"manualComps":false},{"id":"cjc-1295-no-dac-10mg-ipamorelin-5mg","name":"CJC-1295 No DAC 10mg / Ipamorelin 5mg","type":"blend","vials":[15],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#00B0FF","about":"This vial is labeled 10 mg of CJC-1295 without DAC and 5 mg of ipamorelin. CJC-1295 without DAC is a short-acting GHRH analog and ipamorelin is a selective ghrelin-receptor agonist, a pairing studied for growth-hormone pulses.","comps":[{"id":"cjc","name":"CJC-1295 No DAC","mg":10,"unit":"mcg","c":"#00B0FF","def":100,"hint":"100 mcg 1\u20133x daily (commonly cited)"},{"id":"ipa","name":"Ipamorelin","mg":5,"unit":"mcg","c":"#2962FF","def":200,"hint":"100\u2013300 mcg 1\u20133x daily (commonly cited)"}],"manualComps":false},{"id":"bpc40","name":"BPC-157 40mg","type":"peptide","vials":[40],"manual":false,"unit":"mcg","def":250,"hint":"250\u2013500 mcg 1\u20132x daily (commonly cited)","fda":"Not FDA-approved; limited 503A compounding discretion (2026)","c":"#00C853","about":"BPC-157 is a synthetic fragment of a gastric protein, studied mainly in animal models of tendon, gut, and soft-tissue repair. Proposed mechanisms include nitric oxide signaling and growth-factor pathways involved in angiogenesis and healing.","comps":null,"manualComps":false},{"id":"cagri","name":"Cagrilintide","type":"peptide","vials":[5,10],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#4A148C","about":"Cagrilintide is a long-acting amylin analog studied for satiety and weight. Amylin-receptor agonism slows gastric emptying and reduces food intake, and it has been studied together with semaglutide.","comps":null,"manualComps":false},{"id":"ghk-cu-bpc-157-blend-50-10mg","name":"GHK-Cu / BPC-157 Blend 50/10mg","type":"blend","vials":[60],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#00ACC1","about":"This vial is labeled GHK-Cu 50 mg and BPC-157 10 mg. GHK-Cu is a copper tripeptide studied for tissue remodeling, and BPC-157 is a gastric-peptide fragment studied for soft-tissue repair.","comps":[{"id":"ghk","name":"GHK-Cu","mg":50,"unit":"mg","c":"#00ACC1","def":1,"hint":"1\u20132 mg daily (commonly cited)"},{"id":"bpc","name":"BPC-157","mg":10,"unit":"mcg","c":"#00C853","def":250,"hint":"250\u2013500 mcg 1\u20132x daily (commonly cited)"}],"manualComps":false},{"id":"selank","name":"Selank","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":250,"hint":"250\u2013500 mcg daily (commonly cited)","fda":"Not FDA-approved; FDA Category 2","c":"#64DD17","about":"Selank is a synthetic analog of the immunomodulatory peptide tuftsin, studied mainly in Russian research for anxiety and attention. Proposed mechanisms include GABA and monoamine modulation.","comps":null,"manualComps":false},{"id":"semax","name":"Semax","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":300,"hint":"200\u2013600 mcg daily (commonly cited)","fda":"Not FDA-approved","c":"#1DE9B6","about":"Semax is a synthetic ACTH(4-10) analog studied for cognition and neuroprotection. Research has examined effects on BDNF and brain monoamine systems.","comps":null,"manualComps":false},{"id":"ara-290","name":"ARA-290","type":"peptide","vials":[16],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#01579B","about":"ARA-290 (cibinetide) is an erythropoietin-derived peptide that targets the innate repair receptor rather than the receptor that drives red-cell production. It is studied for neuropathic pain and tissue protection.","comps":null,"manualComps":false},{"id":"nad-mots-c-5-amino-1mq-blend","name":"NAD+ / MOTS-c / 5-Amino-1MQ Blend","type":"blend","vials":[120],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#D500F9","about":"This blend combines NAD+, the mitochondrial peptide MOTS-c, and 5-Amino-1MQ, an NNMT inhibitor, which are studied for cellular energy and metabolic pathways. The 120 mg label does not say how many milligrams of each component are in the vial.","comps":[{"id":"nad","name":"NAD+","mg":null,"unit":"mg","c":"#D500F9","def":50,"hint":"50\u2013100 mg 1\u20133x weekly SC (no live source confirmed)"},{"id":"mots","name":"MOTS-c","mg":null,"unit":"mg","c":"#FF6D00","def":5,"hint":"5\u201310 mg weekly, often split (commonly cited)"},{"id":"amino","name":"5-Amino-1MQ","mg":null,"unit":"mg","c":"#5E35B1","def":null,"hint":null}],"manualComps":true},{"id":"kiss","name":"Kisspeptin-10","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":100,"hint":"100 mcg (commonly cited, research)","fda":"Not FDA-approved; FDA Category 2","c":"#FF1744","about":"Kisspeptin-10 is a short kisspeptin fragment that stimulates GnRH neurons through the KISS1 receptor. That pathway is studied for luteinizing-hormone release and reproductive signaling.","comps":null,"manualComps":false},{"id":"igf-1-lr3","name":"IGF-1 LR3","type":"peptide","vials":[1],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#00897B","about":"IGF-1 LR3 is a long-acting IGF-1 analog with an extension peptide and a substitution that lowers binding to IGF-binding proteins. It is studied for prolonged activation of the IGF-1 receptor and downstream anabolic signaling.","comps":null,"manualComps":false},{"id":"amino","name":"5-Amino-1MQ Chloride","type":"peptide","vials":[10,50],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#5E35B1","about":"This listing is the chloride form of 5-Amino-1MQ, a small-molecule inhibitor of nicotinamide N-methyltransferase (NNMT), not a peptide. NNMT inhibition is studied for effects on the NAD salvage pathway and metabolic rate.","comps":null,"manualComps":false},{"id":"oxytocin","name":"Oxytocin","type":"peptide","vials":[5],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#3949AB","about":"Oxytocin is the nine-amino-acid hormone that binds oxytocin receptors to cause uterine contraction and milk ejection, and it is also studied for social behavior. Prescription products are labeled in international units, while this calculator treats the vial as milligrams of peptide and does not convert IU.","comps":null,"manualComps":false},{"id":"cartalax-bioregulator","name":"Cartalax (Bioregulator)","type":"bioregulator","vials":[20],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#C2185B","about":"Cartalax (Ala-Glu-Asp) is a short peptide from the Khavinson bioregulator series, studied in cartilage and connective-tissue cell models. Those peptides are proposed to shift gene expression in the tissue they were patterned on, and independent clinical evidence is limited.","comps":null,"manualComps":false},{"id":"cjc","name":"CJC-1295 No DAC","type":"peptide","vials":[5],"manual":false,"unit":"mcg","def":100,"hint":"100 mcg 1\u20133x daily (commonly cited)","fda":"Not FDA-approved; FDA Category 2","c":"#00B0FF","about":"CJC-1295 without DAC is a short-acting GHRH analog that stimulates pituitary growth-hormone release. Without the drug-affinity complex it is not bound to albumin, so the growth-hormone pulse is brief.","comps":null,"manualComps":false},{"id":"ll-37","name":"LL-37","type":"peptide","vials":[5],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#EF6C00","about":"LL-37 is the active human cathelicidin peptide, studied for direct antibacterial activity and for innate immune and wound-repair signaling. It is the cleaved form of cathelicidin that immune cells release at barriers such as skin and mucosa.","comps":null,"manualComps":false},{"id":"eloralintide","name":"Eloralintide","type":"peptide","vials":[],"manual":true,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#00838F","about":"Eloralintide is an investigational long-acting amylin-receptor agonist studied for satiety and weight. Amylin agonism is researched for slowing gastric emptying and reducing appetite.","comps":null,"manualComps":false},{"id":"snap-8-20mg","name":"SNAP-8 \u2013 20mg","type":"peptide","vials":[20],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#6A1B9A","about":"SNAP-8 is an octapeptide used in cosmetic research as a fragment related to the SNARE protein SNAP-25. It is studied, mostly as a topical, for interfering with the complex that releases neurotransmitters at facial-muscle synapses.","comps":null,"manualComps":false},{"id":"selank-10mg-semax-10mg-blend","name":"Selank 10mg / Semax 10mg (Blend)","type":"blend","vials":[20],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#64DD17","about":"This vial is labeled Selank 10 mg and Semax 10 mg. Selank is a tuftsin analog studied for anxiety, and Semax is an ACTH fragment studied for cognition and neuroprotection.","comps":[{"id":"selank","name":"Selank","mg":10,"unit":"mcg","c":"#64DD17","def":250,"hint":"250\u2013500 mcg daily (commonly cited)"},{"id":"semax","name":"Semax","mg":10,"unit":"mcg","c":"#1DE9B6","def":300,"hint":"200\u2013600 mcg daily (commonly cited)"}],"manualComps":false},{"id":"thymulin","name":"Thymulin","type":"peptide","vials":[10],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#2E7D32","about":"Thymulin is a zinc-dependent thymic nonapeptide studied for T-cell differentiation and immune modulation. The peptide is described as inactive until zinc is bound to it.","comps":null,"manualComps":false},{"id":"pinealon-bioregulator","name":"Pinealon (Bioregulator)","type":"bioregulator","vials":[],"manual":true,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#AD1457","about":"Pinealon (Glu-Asp-Arg) is a Khavinson short peptide studied in neuronal models for effects on brain-cell gene expression. Independent clinical evidence for this tripeptide is limited.","comps":null,"manualComps":false},{"id":"testagen-bioregulator","name":"Testagen (Bioregulator)","type":"bioregulator","vials":[],"manual":true,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#4527A0","about":"Testagen (Lys-Glu-Asp-Gly) is a Khavinson short peptide studied in connection with male reproductive tissue. The proposed action is tissue-patterned gene-expression signaling, and independent clinical evidence is limited.","comps":null,"manualComps":false},{"id":"mazdutide","name":"Mazdutide","type":"peptide","vials":[6,12],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#0277BD","about":"Mazdutide is a dual GLP-1 and glucagon receptor agonist studied for glucose control and weight. GLP-1 activity is tied to satiety and insulin release, while glucagon-receptor activity is studied for raising energy expenditure.","comps":null,"manualComps":false},{"id":"prostamax-bioregulator","name":"Prostamax (Bioregulator)","type":"bioregulator","vials":[20],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#558B2F","about":"Prostamax (Lys-Glu-Asp-Pro) is a Khavinson short peptide studied in connection with prostate tissue. It is proposed to act through short-peptide gene-expression signaling, with limited independent clinical evidence.","comps":null,"manualComps":false},{"id":"pe-22-28","name":"PE-22-28","type":"peptide","vials":[8],"manual":false,"unit":"mcg","def":null,"hint":null,"fda":null,"c":"#6D4C41","about":"PE-22-28 is a short analog of spadin, studied in preclinical models as a blocker of the TREK-1 potassium channel. That mechanism is researched for antidepressant-like effects.","comps":null,"manualComps":false},{"id":"survodutide-12mg","name":"Survodutide 12mg","type":"peptide","vials":[12],"manual":false,"unit":"mg","def":null,"hint":null,"fda":null,"c":"#283593","about":"Survodutide is a dual GLP-1 and glucagon receptor agonist studied for weight loss and for metabolic dysfunction-associated steatohepatitis. GLP-1 activity is tied to appetite and insulin, while glucagon-receptor activity is studied for energy expenditure.","comps":null,"manualComps":false},{"id":"vesugen-bioregulator","name":"Vesugen (Bioregulator)","type":"bioregulator","vials":[20],"ma

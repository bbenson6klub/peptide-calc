<style>
:root{--bg:#0f0f14;--card:#1a1a24;--tx:#fff;--t2:#b9b9c8;--t3:#555566}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px)}
#app{max-width:640px;margin:0 auto}
h2{font-size:18px;margin:22px 0 10px}
.hero{border-radius:20px;padding:18px;color:#fff}
.hero .n{font-size:24px;font-weight:800}.box{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 15px;border-radius:999px;border:2px solid;background:transparent;color:var(--tx);font-weight:600;font-size:15px;min-height:44px;font-family:inherit}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:700;font-size:15px;background:transparent;color:var(--t2);font-family:inherit}
.seg button.on{background:linear-gradient(120deg,#FF3D7F,#651FFF);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:12px}
label{flex:1 1 130px;font-size:13px;color:var(--t2);display:flex;flex-direction:column;gap:4px}
input{font-size:18px;padding:12px;border-radius:12px;border:2px solid #333;background:var(--card);color:#fff;width:100%;font-family:inherit}
.tile{border-radius:16px;padding:13px 15px;color:#fff;flex:1 1 140px;min-width:0}
.tile .b{font-size:22px;font-weight:800}.tile .s{font-size:13px;opacity:.9}
.calc{width:100%;margin-top:22px;padding:18px;border:0;border-radius:18px;background:linear-gradient(120deg,#FF3D7F,#FF7A00);color:#fff;font-size:22px;font-weight:800;font-family:inherit;box-shadow:0 6px 18px rgba(255,61,127,.35)}
.instr{margin-top:14px;background:linear-gradient(120deg,#FF3D7F,#AA00FF);border-radius:16px;padding:14px 16px;font-weight:600}
.warn{background:#FF1744;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:600}
.note{background:#FFB300;color:#222;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #2a2a36}
a{color:#7fd8ff}.small{font-size:12px;color:var(--t2)}
.vc{border:2px solid;border-radius:16px;padding:12px;margin-bottom:10px}

["semax","Semax","Cognition, neuroprotection","200–600 mcg daily (commonly cited)",300,"mcg",[5,10],"Not FDA-approved","#1DE9B6"],
["aod","AOD-9604","Fat loss (hGH fragment)","250–300 mcg daily (commonly cited)",300,"mcg",[2,5,10],"Not FDA-approved; FDA Category 2","#FFD600"],

].map(a=>({id:a[0],name:a[1],use:a[2],dose:a[3],def:a[4],unit:a[5],vials:a[6],fda:a[7],c:a[8]}));
const COM={bpc:5,tb:5,cjc:2,ipa:5,serm:9,tesa:2,ghk:50,pt:10,mots:10,selank:5,semax:5,aod:5,nad:500,epi:10,kiss:5};

const SYR=[
{id:"u30",label:"U-100 0.3 mL",ml:.3,scale:100,tick:1,unit:"units",n:30,le:5,lab:5,lo:5,hi:25,ref:10,desc:"Ticks: 1 unit each, long line and number every 5 (30 total). Half-unit versions add 0.5 marks."},

{id:"u100",label:"U-100 1 mL",ml:1,scale:100,tick:2,unit:"units",n:50,le:5,lab:5,lo:5,hi:50,ref:10,desc:"Ticks: 2 units each, long line and number every 10 (100 total)."},

{id:"tb1",label:"TB 1 mL",ml:1,scale:1,tick:.01,unit:"mL",n:100,le:5,lab:10,lo:.05,hi:.5,ref:.1,desc:"Ticks: 0.01 mL, long line every 0.05, numbered every 0.1 mL."},
{id:"tb3",label:"TB 3 mL",ml:3,scale:1,tick:.1,unit:"mL",n:30,le:5,lab:5,lo:.2,hi:2,ref:.5,desc:"Ticks: 0.1 mL, long line and number every 0.5 mL."}];
const PRE=[["Wolverine (BPC + TB)",["bpc","tb"]],["CJC + Ipamorelin",["cjc","ipa"]],["GLOW (BPC + TB + GHK)",["bpc","tb","ghk"]],["Tesamorelin + Ipamorelin",["tesa","ipa"]],["Selank + Semax",["selank","semax"]]];

const sc=(fits?1e4:0)+(inR?1e3:0)+(onT?100:0)+(five?50:0)+(std?5:0)+(Math.abs(m-Math.round(m))<1e-6?60:0)-Math.abs(Math.log(m/s.ref))*10;if(!b||sc>b.sc)b={w,m,sc,inR,onT,fits}}return b}

if(id=="tesa"&&(v==2||v==11.6)){const w=v==2?.5:1.3;return{w,m:d*w/v*s.scale,why:"Matches the Egrifta label mixing volume."}}

function instr(s,m){if(m>s.ml*s.scale+1e-9)return`More than a full ${s.label} syringe. Use more water, a bigger syringe, or separate injections. ${s.desc}`;
const k=m/s.tick,n=Math.round(k),u=x=>s.scale==1?f(x,2)+" mL":f(x,2)+"-unit";
if(Math.abs(k-n)<.01){const L=Math.floor(n/s.le),r=n%s.le;const w=r==0?`the ${ord(L)} long line`:L==0?`the ${ord(r)} short tick from zero`:`${r} short tick${r>1?"s":""} past the ${ord(L)} long line`;return`Draw to the ${u(n*s.tick)} line (${w}) on a ${s.label} syringe. ${s.desc}`}
const a=Math.floor(k)*s.tick;const h=s.id=="u30"&&Math.abs(m*2-Math.round(m*2))<.01?" On a half-unit 0.3 mL syringe this is a half-unit mark.":"";
return`Draw to about ${mk(s,m)}, between the ${u(a)} and ${u(a+s.tick)} ticks on a ${s.label} syringe.${h} ${s.desc}`}
function svg(s,segs,label){const X0=124,BW=500,tot=segs.reduce((a,g)=>a+g.vol,0),over=tot>s.ml+1e-9,fx=X0+BW*Math.min(1,isFinite(tot)?tot/s.ml:0);let x0=X0+2,o="";
for(const g of segs){const w=Math.max(0,Math.min(fx-x0,BW*g.vol/s.ml));o+=`<rect x="${x0}" y="60" width="${w}" height="60" fill="${over?"#FF1744":g.c}" fill-opacity=".5"/><line x1="${x0+w}" x2="${x0+w}" y1="60" y2="120" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>`;x0+=w}
let t="";for(let i=0;i<=s.n;i++){const x=X0+BW*i/s.n,L=i%s.le==0;t+=`<line x1="${x}" x2="${x}" y1="58" y2="${L?82:70}" stroke="#111" stroke-width="${L?2:1.1}" opacity=".9"/>`;if(i%s.lab==0)t+=`<text x="${x}" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke" font-family="Helvetica,Arial,sans-serif">${s.scale==1?f(i*s.tick,2):f(i*s.tick,0)}</text>`}
const ribs=[0,6,12].map(d=>`<rect x="${fx+d}" y="58" width="4" height="64" fill="#2b2b2b"/>`).join("");
return`<svg width="100%" viewBox="0 0 760 190" style="margin-top:16px;display:block"><defs>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#eef4f8" stop-opacity=".9"/><stop offset=".75" stop-color="#d7e2ea" stop-opacity=".9"/><stop offset="1" stop-color="#f7fbff" stop-opacity=".95"/></linearGradient>
<linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8f96"/><stop offset=".45" stop-color="#f4f6f8"/><stop offset="1" stop-color="#6b7077"/></linearGradient>
<linearGradient id="or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset=".5" stop-color="#FF7A00"/><stop offset="1" stop-color="#C85A00"/></linearGradient>
<linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#444"/><stop offset=".4" stop-color="#111"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="lq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".15"/></linearGradient>
<linearGradient id="rd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#dfe6ec" stop-opacity=".75"/></linearGradient></defs>
<polygon points="8,90 14,88 92,88 92,92 14,92" fill="url(#st)"/>
<path d="M92,78 L104,74 L124,70 L124,110 L104,106 L92,102 Z" fill="url(#or)"/><line x1="104" y1="76" x2="104" y2="104" stroke="#C85A00" stroke-width="1.5"/><line x1="112" y1="74" x2="112" y2="106" stroke="#C85A00" stroke-width="1.5"/>
<rect x="${fx+18}" y="80" width="${Math.max(0,690-fx-18)}" height="20" fill="url(#rd)" stroke="#c9d3db"/><line x1="${fx+18}" y1="90" x2="690" y2="90" stroke="#c9d3db" stroke-width="2"/>
<rect x="${X0}" y="56" width="${BW+6}" height="68" rx="8" fill="url(#gl)" stroke="#9fb0bd" stroke-width="2"/>
${o}<rect x="${X0+2}" y="60" width="${Math.max(0,fx-X0-2)}" height="60" fill="url(#lq)"/>
<rect x="${fx+18}" y="80" width="${Math.max(0,X0+BW-fx-18)}" height="20" fill="url(#rd)" opacity=".55"/>
<rect x="${fx-2}" y="57" width="20" height="66" rx="4" fill="url(#rb)"/>${ribs}<path d="M${fx-1},60 Q${fx-7},90 ${fx-1},120" fill="#111"/>
${t}<rect x="${X0+8}" y="61" width="${BW-12}" height="5" rx="2.5" fill="#fff" opacity=".8"/><rect x="${X0+8}" y="114" width="${BW-12}" height="3" rx="1.5" fill="#fff" opacity=".5"/>
<text x="${X0+14}" y="116" font-size="11" font-weight="700" fill="#111" font-family="Helvetica,Arial,sans-serif">${s.scale==100?"U-100":s.scale==40?"U-40":"mL"}</text>
<rect x="${X0+BW+4}" y="30" width="12" height="120" rx="5" fill="url(#rd)" stroke="#b7c3cc" stroke-width="1.5"/>
<rect x="690" y="52" width="14" height="76" rx="6" fill="url(#rd)" stroke="#b7c3cc" stroke-width="1.5"/>
<polygon points="${fx-10},30 ${fx+10},30 ${fx},50" fill="#FF3D7F" stroke="#fff" stroke-width="1.5"/><line x1="${fx}" y1="50" x2="${fx}" y2="56" stroke="#FF3D7F" stroke-width="2"/>
<text x="${Math.max(70,Math.min(660,fx))}" y="22" text-anchor="middle" font-size="18" font-weight="800" fill="#FF3D7F">${over?"Over capacity":esc(label)}</text>
<text x="${X0}" y="172" font-size="14" fill="#b9b9c8">${s.unit} · needle end ← liquid → plunger</text></svg>`}
function needles(ids){const th=ids.some(i=>i=="ghk"||i=="nad"),kit=ids.filter(i=>i=="tesa"||i=="pt");const r=(c,h,b)=>`<div class="tile" style="background:${c};flex-basis:200px"><div style="font-weight:800">${h}</div><div class="s">${b}</div></div>`;
return`<h2>Recommended needles</h2><div class="row">${r("#00C853","Inject: 29–31G, 6 mm","Insulin syringe under the skin. 6 mm preferred; 8 mm (5/16\") only with a skin pinch or 45°; 12.7 mm (1/2\") not recommended (risk of hitting muscle).")}${th?r("#D500F9","Thicker mix: 27–30G","GHK-Cu or NAD+ may push easier with a slightly wider needle (general guidance, unverified)."):""}${r("#2962FF","Mixing: 18–21G","Drawing needle to add bac water if you use a separate needle (general guidance, unverified).")}${kit.length?r("#FF7A00","Label kit",kit.map(i=>i=="tesa"?"Tesamorelin (Egrifta)":"PT-141 (Vyleesi autoinjector)").join(" and ")+": use the kit's needles, per the label."):""}</div><div class="small" style="margin-top:6px">Needle length source: <a href="https://doi.org/10.1016/j.mayocp.2025.01.004">FITTER Forward, Mayo Clin Proc 2025</a>. General guidance, not medical advice.</div>`}

const S={mode:"Single",pid:"bpc",vial:"5",wo:null,dose:"250",du:"mcg",sid:"u100",done:"",
mem:["bpc","tb"],how:"Blend",ssid:"u100",mg:{},ds:{},swo:{},prim:"bpc",sdone:""};
const chip=(on,c,act,txt)=>`<button class="chip" style="border-color:${c};${on?`background:${c};color:#fff`:""}" data-a="${esc(act)}">${esc(txt)}</button>`;
const seg=(opts,v,act)=>`<div class="seg">${opts.map(o=>`<button class="${o==v?"on":""}" data-a="${act}:${o}">${o}</button>`).join("")}</div>`;
const inp=(lab,key,val)=>`<label>${esc(lab)}<input type="number" inputmode="decimal" step="any" data-k="${key}" value="${esc(val)}"></label>`;
const keyS=()=>JSON.stringify([S.pid,S.vial,S.wo,S.dose,S.du,S.sid]);
const keyT=()=>JSON.stringify([S.mem,S.how,S.ssid,S.mg,S.ds,S.swo,S.prim]);
function single(){const p=P(S.pid),s=Sy(S.sid),v=parseFloat(S.vial),dd=parseFloat(S.dose),dmg=S.du=="mcg"?dd/1000:dd;
const rec=recW(v,dmg,s,p.id),water=S.wo??(rec?String(rec.w):"2"),w=parseFloat(water);
const conc=v/w,vol=dmg/conc,marks=vol*s.scale,ok=v>0&&w>0&&dd>0,show=S.done==keyS(),over=vol>s.ml,st=STO[p.id]||GEN;
const sizes=[...new Set([...p.vials,2,5,10,15,20])].sort((a,b)=>a-b);
let h=`<div class="hero" style="background:linear-gradient(120deg,${p.c},#651FFF 60%,#00B0FF)"><div class="n">${p.name}</div><div>${p.use}</div><div class="box">${p.dose}</div><div class="small" style="color:#fff;margin-top:6px;font-weight:600">${p.fda}</div><div class="box" style="background:rgba(255,255,255,.18)"><b>Storage after mixing:</b> ${st[0]}<br><b>Unmixed:</b> ${st[1]}</div></div>
<h2>Peptide</h2><div class="chips">${PEP.map(x=>chip(x.id==p.id,x.c,"pick:"+x.id,x.name)).join("")}</div>
<h2>Vial and water</h2><div class="chips">${sizes.map(z=>chip(S.vial==String(z),"#FF7A00","vial:"+z,z+" mg"+(z==COM[p.id]?" ★":""))).join("")}</div>
<div class="row" style="margin-top:12px">${inp("Vial (mg)","vial",S.vial)}${inp(S.wo==null?"Bac water (mL), auto":"Bac water (mL), yours","water",water)}</div>
${rec?`<div class="tile" style="background:#00B0FF;margin-top:12px"><div style="font-size:18px;font-weight:800">Add ${rec.w} mL bac water (${f(v/rec.w,3)} mg/mL)${S.wo==null?" ✓":""}</div><div class="s">${f(v)} mg vial + ${rec.w} mL = ${f(v/rec.w,3)} mg/mL; ${esc(S.dose)} ${S.du} = ${mk(s,rec.m)} on ${s.label}. ${rec.why}</div>${S.wo!=null?chip(false,"#fff","reset","Use recommended"):""}</div>`:""}
<table><tr><th>Vial</th><th>Add water</th><th>mg/mL</th><th>Draw (${s.label})</th></tr>${sizes.map(z=>{const x=recW(z,dmg,s,p.id);return`<tr style="font-weight:${z==COM[p.id]?800:400}"><td>${z} mg${z==COM[p.id]?" ★":""}</td><td>${x?x.w+" mL":"–"}</td><td>${x?f(z/x.w,2):"–"}</td><td>${x?mk(s,x.m):"–"}</td></tr>`}).join("")}</table>
<div class="small">★ most common size (typical vendor listings, unverified).</div>
<h2>Dose</h2><div class="row" style="align-items:flex-end">${inp("Dose ("+S.du+")","dose",S.dose)}<div style="flex:1 1 130px">${seg(["mcg","mg"],S.du,"du")}</div></div>
<h2>Syringe</h2><div class="chips">${SYR.map(x=>chip(x.id==s.id,"#AA00FF","sid:"+x.id,x.label)).join("")}</div>
<button class="calc" data-a="calc">${show?"Calculated ✓  Tap to recalculate":"Calculate"}</button>`;
if(ok&&show){const pu=s.scale==1?conc*10:conc*1000/s.scale;
h+=`<h2>Draw</h2><div class="row"><div class="tile" style="background:#FF3D7F"><div class="b">${mk(s,marks)}</div><div class="s">Draw on ${s.label}</div></div><div class="tile" style="background:#00C853"><div class="b">${f(vol,3)} mL</div><div class="s">Volume</div></div><div class="tile" style="background:#2962FF"><div class="b">${f(conc,3)} mg/mL</div><div class="s">Concentration</div></div><div class="tile" style="background:#FF7A00"><div class="b">${f(pu)} mcg</div><div class="s">${s.scale==1?"per 0.01 mL":"per unit"}</div></div><div class="tile" style="background:#AA00FF"><div class="b">${f(Math.floor(v/dmg*10)/10,1)}</div><div class="s">Doses per vial</div></div></div>
<div class="instr">${esc(instr(s,marks))}</div>${svg(s,[{vol,c:p.c}],"Draw to "+mk(s,marks))}${over?`<div class="warn">Over ${s.label} capacity. Add more water or use a bigger syringe.</div>`:""}${!over&&marks<s.tick?`<div class="note">Below one tick. Use less water for accuracy.</div>`:""}${needles([p.id])}`}
return h}
function stack(){const s=Sy(S.ssid),ps=S.mem.map(P),pr=S.mem.includes(S.prim)?S.prim:S.mem[0],pp=P(pr);
const gv=p=>S.mg[p.id]??String(COM[p.id]??p.vials[0]),gd=p=>S.ds[p.id]??String(p.def),dm=p=>{const d=parseFloat(gd(p));return p.unit=="mcg"?d/1000:d};
const amt=(p,x)=>p.unit=="mcg"?f(x*1000,1)+" mcg":f(x,3)+" mg";
const vP=parseFloat(gv(pp)),bR=recW(vP,dm(pp),s,pp.id),bW=parseFloat(S.swo.blend??String(bR?bR.w:2)),bV=dm(pp)/(vP/bW);
const sep=ps.map(p=>{const v=parseFloat(gv(p)),rc=recW(v,dm(p),s,p.id),w=parseFloat(S.swo[p.id]??String(rc?rc.w:2)),vol=dm(p)/(v/w);return{p,v,rc,w,vol,m:vol*s.scale}});
const tv=S.how=="Blend"?bV:sep.reduce((a,x)=>a+x.vol,0),tm=tv*s.scale,over=tv>s.ml+1e-9,ok=isFinite(tv)&&tv>0,show=S.sdone==keyT();
const strict=ps.reduce((a,p)=>(RANK[p.id]??3)<(RANK[a.id]??3)?p:a,ps[0]),mixed=new Set(ps.map(p=>RANK[p.id]??3)).size>1;
let h=`<div class="hero" style="background:linear-gradient(120deg,${ps.map(p=>p.c).join(",")}${ps.length<2?",#651FFF":""})"><div class="n">${ps.map(p=>p.name).join(" + ")}</div>${ps.map(p=>`<div class="box"><b>${p.name}:</b> ${p.dose}<br><b>Storage after mixing:</b> ${(STO[p.id]||GEN)[0]}</div>`).join("")}${S.how=="Blend"?`<div style="font-size:13px;font-weight:700;margin-top:8px">Blend storage: follow ${mixed?`the strictest rule (${strict.name}'s)`:"the shared rule above"}; the shortest use-by applies to the whole vial.</div>`:""}</div>
<h2>Stack presets</h2><div class="chips">${PRE.map((x,i)=>chip(JSON.stringify(x[1])==JSON.stringify(S.mem),"#FF3D7F","pre:"+i,x[0])).join("")}</div>
<h2>Or pick 2–3</h2><div class="chips">${PEP.map(x=>chip(S.mem.includes(x.id),x.c,"tog:"+x.id,x.name)).join("")}</div>${S.mem.length<2?`<div class="note">Pick at least 2 peptides to stack.</div>`:""}
<h2>How it's mixed</h2>${seg(["Blend","Separate vials"],S.how,"how")}
<h2>Syringe</h2><div class="chips">${SYR.map(x=>chip(x.id==s.id,"#AA00FF","ssid:"+x.id,x.label)).join("")}</div>`;
if(S.how=="Blend"){h+=`<h2>Blend vial</h2><div class="chips">${ps.map(p=>chip(p.id==pr,p.c,"prim:"+p.id,"Dose by "+p.name)).join("")}</div><div class="row" style="margin-top:12px">${ps.map(p=>inp(p.name+" mg in vial","mg:"+p.id,gv(p))).join("")}${inp(pp.name+" dose ("+pp.unit+")","ds:"+pp.id,gd(pp))}${inp(S.swo.blend==null?"Bac water (mL), auto":"Bac water (mL), yours","swo:blend",String(bW))}</div>
${bR?`<div class="tile" style="background:#00B0FF;margin-top:12px"><div style="font-size:18px;font-weight:800">Add ${bR.w} mL bac water (${f(vP/bR.w,3)} mg/mL ${pp.name})${S.swo.blend==null?" ✓":""}</div><div class="s">${esc(gd(pp))} ${pp.unit} = ${mk(s,bR.m)}. ${bR.why} Others follow the vial ratio.</div>${S.swo.blend!=null?chip(false,"#fff","sreset","Use recommended"):""}</div>`:""}`}
else{h+=`<h2>Separate vials</h2>`+sep.map(x=>`<div class="vc" style="border-color:${x.p.c}"><div style="font-weight:800;color:${x.p.c};margin-bottom:6px">${x.p.name}</div><div class="row">${inp("Vial (mg)","mg:"+x.p.id,gv(x.p))}${inp("Dose ("+x.p.unit+")","ds:"+x.p.id,gd(x.p))}${inp(S.swo[x.p.id]==null?"Water (mL), auto":"Water (mL), yours","swo:"+x.p.id,String(x.w))}</div>${x.rc?`<div class="small" style="margin-top:6px">Add ${x.rc.w} mL bac water: ${f(x.v/x.rc.w,3)} mg/mL; ${esc(gd(x.p))} ${x.p.unit} = ${mk(s,x.rc.m)}. ${x.rc.why}</div>`:""}</div>`).join("")}
h+=`<button class="calc" data-a="scalc">${show?"Calculated ✓  Tap to recalculate":"Calculate stack"}</button>`;
if(ok&&show){h+=`<h2>Stack draw</h2><div class="row">${S.how=="Blend"?ps.map(p=>`<div class="tile" style="background:${p.c}"><div class="b">${amt(p,bV*(parseFloat(gv(p))/bW))}</div><div class="s">${p.name} per draw</div></div>`).join(""):sep.map(x=>`<div class="tile" style="background:${x.p.c}"><div class="b">${mk(s,x.m)}</div><div class="s">${x.p.name}, ${esc(gd(x.p))} ${x.p.unit}</div></div>`).join("")}<div class="tile" style="background:${over?"#FF1744":"#333"}"><div class="b">${mk(s,tm)}</div><div class="s">${S.how=="Blend"?"One draw":"Total in one syringe"} · ${f(tv,3)} mL</div></div></div>
<div class="instr">${S.how!="Blend"&&!over?esc(`Draw ${sep.map(x=>x.p.name+" "+mk(s,x.m)).join(", then ")}, in that order. Final total: `):""}${esc(instr(s,tm))}</div>${svg(s,S.how=="Blend"?[{vol:bV,c:ps[0].c}]:sep.map(x=>({vol:x.vol,c:x.p.c})),"Draw to "+mk(s,tm))}
${over?`<div class="warn">Total ${mk(s,tm)} is over ${s.label} capacity. Use a bigger syringe or inject separately.</div>`:""}${needles(S.mem)}${S.how!="Blend"?`<div class="note">Mixing different vials in one syringe: check compatibility; many people inject separately.</div>`:""}`}
return h}
function render(){const y=scrollY;document.getElementById("app").innerHTML=seg(["Single","Stack"],S.mode,"mode")+(S.mode=="Single"?single():stack())+`<p class="small" style="margin-top:24px">For educational and research use only, not medical advice. Confirm doses with a clinician.</p>`;scrollTo(0,y)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const [a,v]=b.dataset.a.split(/:(.*)/);
if(a=="mode")S.mode=v;else if(a=="pick"){const p=P(v);S.pid=v;S.vial=String(COM[v]);S.wo=null;S.dose=String(p.def);S.du=p.unit}
else if(a=="vial"){S.vial=v;S.wo=null}else if(a=="reset")S.wo=null;else if(a=="sid"){S.sid=v;S.wo=null}
else if(a=="du"){const n=parseFloat(S.dose);if(v!=S.du&&isFinite(n))S.dose=f(v=="mg"?n/1000:n*1000,4);S.du=v}
else if(a=="calc")S.done=keyS();else if(a=="scalc")S.sdone=keyT();
else if(a=="pre"){S.mem=[...PRE[v][1]];S.prim=S.mem[0];S.swo={}}
else if(a=="tog"){S.swo={};S.mem=S.mem.includes(v)?(S.mem.length>1?S.mem.filter(x=>x!=v):S.mem):S.mem.length<3?[...S.mem,v]:S.mem}
else if(a=="how")S.how=v;else if(a=="ssid"){S.ssid=v;S.swo={}}else if(a=="prim"){S.prim=v;S.swo={}}else if(a=="sreset")S.swo={};
render()});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;const v=e.target.value;const [a,id]=k.split(":");
if(a=="vial"){S.vial=v;S.wo=null}else if(a=="water")S.wo=v;else if(a=="dose"){S.dose=v;S.wo=null}
else if(a=="mg"){S.mg={...S.mg,[id]:v};if(S.how=="Blend")S.swo={};else{const n={...S.swo};delete n[id];S.swo=n}}
else if(a=="ds"){S.ds={...S.ds,[id]:v};if(S.how=="Blend")S.swo={};else{const n={...S.swo};delete n[id];S.swo=n}}
else if(a=="swo")S.swo={...S.swo,[id]:v};render()});
render();
if(location.hash=="#demo"){S.done=keyS();render()}
if(location.hash=="#u30"){S.sid="u30";S.done=keyS();render()}
if(location.hash=="#stack"){S.mode="Stack";S.mg={bpc:"10",tb:"10"};S.sdone=keyT();render()}
if(location.hash=="#sep"){S.mode="Stack";S.how="Separate vials";S.swo={bpc:"2",tb:"2"};S.ds={tb:"2"};S.sdone=keyT();render()}
</script></body></html>
